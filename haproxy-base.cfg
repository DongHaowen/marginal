global
    log /dev/log local0
    stats socket /var/run/haproxy.sock mode 600 level admin
    maxconn 4096

defaults
    mode tcp
    option tcpka
    timeout connect 10s
    timeout client  1m
    timeout server  1m

frontend tidb_front_1
    bind *:4000
    default_backend tidb_back_1

frontend tidb_front_2
    bind *:4001
    default_backend tidb_back_2

frontend tidb_front_3
    bind *:4002
    default_backend tidb_back_3

backend tidb_back_1
    balance roundrobin
    option tcp-check

    server tidb1 10.0.1.1:4000 check weight 1
    server tidb2 10.0.1.2:4000 check weight 1
    server tidb3 10.0.1.3:4000 check weight 1

backend tidb_back_2
    balance roundrobin
    option tcp-check

    server tidb1 10.0.1.2:4000 check weight 2
    server tidb2 10.0.1.3:4000 check weight 1

backend tidb_back_3
    balance roundrobin
    option tcp-check

    server tidb1 10.0.1.1:4000 check weight 1
    server tidb2 10.0.1.2:4000 check weight 3


