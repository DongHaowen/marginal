
global
    log /dev/log local0
    log /dev/log local1 notice

    daemon
    maxconn 20000

    stats socket /var/lib/haproxy/stats mode 600 level admin

defaults
    log global
    mode tcp

    option tcplog
    option dontlognull

    timeout connect 5s
    timeout client  1h
    timeout server  1h

    retries 3

frontend tidb_frontend
    bind *:4000
    default_backend tidb_backend

backend tidb_backend
    server tidb_0 10.0.5.116:4000 check
    server tidb_1 10.0.13.157:4000 check
    server tidb_2 10.0.7.92:4000 check



